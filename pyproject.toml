[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "dictum-binder"
version = "1.0.0"
description = "lspd — deterministic reader, writer and validator of a Dictum project's bindings.yaml"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David H. Jung" }]
dependencies = ["ruamel.yaml>=0.19,<0.20"]

[project.optional-dependencies]
dev = ["ruff>=0.16,<0.17", "pyrefly>=1.3,<1.4"]

[project.scripts]
lspd = "lspd.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pyrefly]
project-includes = ["src", "tests", "tools"]
search-path = [".", "src", "tools"]
python-version = "3.11"
